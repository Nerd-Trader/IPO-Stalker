name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt: system-6
          - os: ubuntu-22.04
            qt: system-5
          - os: macos-14
            qt: 6.8.3
          - os: windows-2022
            qt: 6.8.3

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu, Qt 6)
      if: matrix.qt == 'system-6'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build qt6-base-dev libgl-dev

    - name: Install dependencies (Ubuntu, Qt 5)
      if: matrix.qt == 'system-5'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build qtbase5-dev

    - name: Install Qt (macOS and Windows)
      if: runner.os != 'Linux'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt }}
        cache: true

    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Test
      run: ctest --test-dir build -C Release --output-on-failure
